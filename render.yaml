services:
  - type: web
    name: mingle-chat
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mingle-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false

databases:
  - name: mingle-db
    databaseName: mingle
    user: mingle
    plan: free
    postgresMajorVersion: "16"
